<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สร้างการ์ดคำคม</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400;600&family=Kanit:wght@400&family=Prompt:wght@400&family=Pridi:wght@400&family=Mali:wght@400&family=Itim&family=Taviraj:wght@400&family=Chonburi&family=Charm:wght@400&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f4ef;--panel:#fff;--text:#222;--muted:#6b6b6b;--line:#e2dfd7;--accent:#c2410c;--accent-t:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--panel:#222227;--text:#eee;--muted:#a0a0a8;--line:#35353c;--accent:#fb923c;--accent-t:#1b1b1b}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Sarabun',system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:20px 14px 40px}
h1{font-family:'Mitr','Sarabun',sans-serif;font-weight:500;font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.step{margin-bottom:16px}
.step>label,.lab{display:block;font-weight:600;margin-bottom:8px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip,button,select,input[type=text],textarea{font:inherit;color:var(--text)}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
select,input[type=text],textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.bgs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:10px;border:3px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--accent);outline:2px solid var(--panel);outline-offset:-5px}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.em{width:38px;height:38px;font-size:1.3rem;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer}
.em.on{border-color:var(--accent);background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 16px;cursor:pointer}
.btn.main{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.small{font-size:.85rem;color:var(--muted)}
.preview{position:sticky;top:12px}
.stage{display:flex;justify-content:center}
#card{width:420px;max-width:100%;min-height:420px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:36px;color:#fff;font-family:'Mitr','Sarabun',sans-serif;border-radius:6px}
#card .ic{font-size:54px;line-height:1;flex:none}
#card .tx{min-width:0;max-width:100%}
#card .ic img{width:92px;height:92px;object-fit:cover;border-radius:50%;border:3px solid rgba(255,255,255,.8)}
#card .q{font-weight:400;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-width:100%;text-shadow:0 2px 8px rgba(0,0,0,.25)}
#card .s{margin-top:18px;font-family:'Sarabun',sans-serif;font-size:16px;opacity:.9}
#card .ph{opacity:.8;font-size:16px}
.b0{background:linear-gradient(135deg,#ff7e5f,#feb47b)}
.b1{background:linear-gradient(135deg,#667eea,#764ba2)}
.b2{background:linear-gradient(135deg,#11998e,#38ef7d)}
.b3{background:linear-gradient(135deg,#232526,#414345)}
.b4{background:linear-gradient(135deg,#ee0979,#ff6a00)}
.b5{background:linear-gradient(135deg,#2193b0,#6dd5ed)}
.b6{background:linear-gradient(135deg,#8e2de2,#4a00e0)}
.b7{background:radial-gradient(circle at 30% 20%,#fddb92,#d1913c 90%)}
.b8{background:repeating-linear-gradient(45deg,#1f3a5f,#1f3a5f 14px,#264873 14px,#264873 28px)}
.b9{background:radial-gradient(circle at 70% 80%,#f093fb,#f5576c 70%)}
.msg{min-height:1.3em;margin-top:8px;font-size:.9rem}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>สร้างการ์ดคำคม</h1>
  <p class="sub">เลือกหมวด พื้นหลัง ไอคอน แล้วกดประมวลผล</p>
  <div class="grid">
    <div class="panel">
      <div class="step"><label>1. ประเภทคำคม <span class="small" id="count"></span></label><div class="chips" id="cats"></div></div>
      <div class="step"><label for="pick">เลือกคำคม</label><select id="pick"></select></div>
      <div class="step"><label for="custom">หรือพิมพ์คำคมของคุณเอง (ไม่จำกัดความยาว)</label><textarea id="custom" rows="4" placeholder="พิมพ์หรือวางข้อความที่นี่ ถ้ามีข้อความ ระบบจะใช้ข้อความนี้แทนคำคมที่เลือก"></textarea></div>
      <div class="step"><label>ออกแบบตัวอักษร</label>
        <div class="row" style="margin-bottom:8px"><span>สี</span><input type="color" id="tcolor" value="#ffffff" style="width:48px;height:34px;padding:0;border:1px solid var(--line);border-radius:6px;background:none"></div>
        <select id="font" style="margin-bottom:8px"><option value="'Mitr',sans-serif">Mitr</option><option value="'Sarabun',sans-serif">Sarabun</option><option value="'Kanit',sans-serif">Kanit</option><option value="'Prompt',sans-serif">Prompt</option><option value="'Pridi',serif">Pridi</option><option value="'Taviraj',serif">Taviraj</option><option value="'Mali',cursive">Mali (ลายมือ)</option><option value="'Itim',cursive">Itim (ลายมือ)</option><option value="'Chonburi',serif">Chonburi (หัวข้อ)</option><option value="'Charm',serif">Charm (อ่อนช้อย)</option></select>
        <label class="row" style="font-weight:400"><input type="checkbox" id="autoSz" checked> ปรับขนาดอัตโนมัติ</label>
        <div class="row" style="margin-top:6px"><input type="range" id="sz" min="10" max="72" value="28" style="flex:1" disabled><span class="small" id="szv">28px</span></div>
      </div>
      <div class="step"><label>2. พื้นหลัง</label><div class="bgs" id="bgs"></div>
        <div class="row" style="margin-top:8px"><input type="file" id="bgfile" accept="image/*" hidden><button class="btn" id="bgBtn" type="button">อัปโหลดรูปพื้นหลัง</button><button class="btn" id="bgDel" type="button">ลบรูปพื้นหลัง</button><span class="small" id="bgname"></span></div>
        <div class="row" style="margin-top:6px"><span class="small">ความมืดทับรูป</span><input type="range" id="ov" min="0" max="80" value="30" style="flex:1"><span class="small" id="ovv">30%</span></div></div>
      <div class="step">
        <label>3. ที่มา (ไม่ใส่ก็ได้)</label>
        <label class="row" style="font-weight:400"><input type="checkbox" id="useSrc"> แสดงที่มาในการ์ด</label>
        <input type="text" id="src" placeholder="พิมพ์ที่มา เช่น ชื่อผู้กล่าว" style="margin-top:6px">
      </div>
      <div class="step">
        <label>4. ไอคอน / รูปภาพ</label>
        <div class="emojis" id="emojis"></div>
        <div class="row"><input type="file" id="file" accept="image/*" hidden><button class="btn" id="upBtn" type="button">อัปโหลดรูป</button><span class="small" id="fname"></span></div>
        <div class="lab small" style="margin:10px 0 4px">ตำแหน่ง</div>
        <div class="chips"><button type="button" class="chip" data-g="pos" data-v="left">ซ้าย</button><button type="button" class="chip" data-g="pos" data-v="right">ขวา</button><button type="button" class="chip" data-g="pos" data-v="top">ด้านบน</button><button type="button" class="chip" data-g="pos" data-v="bottom">ด้านล่าง</button></div>
        <div class="lab small" style="margin:10px 0 4px">ขนาด</div>
        <div class="chips"><button type="button" class="chip" data-g="isz" data-v="s">เล็ก</button><button type="button" class="chip" data-g="isz" data-v="m">กลาง</button><button type="button" class="chip" data-g="isz" data-v="l">ใหญ่</button></div>
        <div class="lab small" style="margin:10px 0 4px">รูปทรง</div>
        <div class="chips"><button type="button" class="chip" data-g="ish" data-v="ci">วงกลม</button><button type="button" class="chip" data-g="ish" data-v="sq">สี่เหลี่ยม</button><button type="button" class="chip" data-g="ish" data-v="el">วงรี</button></div>
      </div>
      <div class="row">
        <button class="btn main" id="go" type="button">ประมวลผล</button>
        <button class="btn" id="save" type="button" disabled>บันทึกเป็น PNG</button>
        <button class="btn" id="reset" type="button">รีเซ็ต</button>
      </div>
      <div class="msg small" id="msg"></div>
      <details style="margin-top:12px"><summary>เพิ่มคำคมเข้าฐานข้อมูล (JSON)</summary>
        <p class="small">รูปแบบ: [{"c":"หมวด","t":"ข้อความ","s":"ที่มา"}] — ใช้ขยายฐานข้อมูลให้ถึง 1,000 คำได้</p>
        <textarea id="imp" rows="4"></textarea>
        <div class="row" style="margin-top:6px"><button class="btn" id="impBtn" type="button">นำเข้า</button></div>
      </details>
    </div>
    <div class="panel preview">
      <div class="stage"><div id="card" class="b0"><div class="ph">การ์ดจะแสดงที่นี่<br>กด “ประมวลผล”</div></div></div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
var DEFAULT_DB = {

"ความสุข":[

var EMOJIS=["","🌟","❤️","🌸","🔥","🌿","☀️","🌙","🦋","📚","🎯","💪","🕊️"];
var DB={},st={};
function fresh(){st={cat:"ทั้งหมด",pick:"",bg:0,useSrc:false,src:"",icon:"",img:"",bgImg:"",ov:0.3,pos:"top",isz:"m",ish:"ci"};DB={};

function $(i){return document.getElementById(i)}

 $("cats").innerHTML=h;$("count").textContent="· ทั้งหมด "+total()+" คำ";}

 st.pick="";}

function setSrcFromQuote(){var p=pool(),q=st.pick!==""?p[+st.pick]:null;if(q&&q.s){$("src").value=q.s}}

function build(keep){

 if(keep&&lastQ){q=lastQ}else if(cu){q={t:cu,s:""}}else{var p=pool();if(!p.length){$("msg").textContent="ไม่มีคำคมในหมวดนี้";return}

 if(st.pick===""){ $("src").value=q.s||"" }}

 var len=q.t.length,fs=len<30?34:len<60?28:len<90?24:len<150?20:len<300?17:len<600?14:11;

 c.style.color=$("tcolor").value;
 var h="";
 var sz={s:64,m:104,l:150}[st.isz],iw=sz,rad="50%",row=(st.pos==="left"||st.pos==="right");
 if(st.ish==="sq")rad="10px";if(st.ish==="el")iw=Math.round(sz*(row?1.15:1.4));
 if(st.img)h+='<div class="ic"><img src="'+st.img+'" alt="" style="width:'+iw+'px;height:'+sz+'px;border-radius:'+rad+'"></div>';else if(st.icon)h+='<div class="ic" style="font-size:'+Math.round(sz*.6)+'px">'+st.icon+'</div>';
 var d=document.createElement("div");d.className="q";d.style.fontSize=fs+"px";d.style.fontFamily=$("font").value;d.textContent="“"+q.t+"”";
 c.innerHTML=h;var tx=document.createElement("div");tx.className="tx";tx.appendChild(d);c.appendChild(tx);
 c.style.flexDirection={top:"column",bottom:"column-reverse",left:"row",right:"row-reverse"}[st.pos];if(row)tx.style.flex="1";
 var s=$("src").value.trim();

function ready(){var s=$("pick");}
document.addEventListener("click",function(e){var t=e.target;
 if(t.dataset.g){st[t.dataset.g]=t.dataset.v;renderLayout();restyle();}
 else if(t.dataset.c){st.cat=t.dataset.c;renderCats();renderPick();}
 else if(t.dataset.b!==undefined){st.bg=+t.dataset.b;st.bgImg="";$("bgname").textContent="";renderBgs();$("card").className="b"+st.bg;applyBg();}
 else if(t.dataset.e!==undefined){st.icon=t.dataset.e;st.img="";$("fname").textContent="";renderEmojis();}
});
$("pick").addEventListener("change",function(){st.pick=this.value;setSrcFromQuote();});
$("useSrc").addEventListener("change",function(){st.useSrc=this.checked;});
$("upBtn").addEventListener("click",function(){$("file").click()});
$("file").addEventListener("change",function(){var f=this.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){st.img=r.result;st.icon="";$("fname").textContent=f.name;renderEmojis();};r.readAsDataURL(f);});
$("go").addEventListener("click",function(){build(false)});
function applyBg(){var c=$("card");if(st.bgImg){var o="rgba(0,0,0,"+st.ov+")";c.style.backgroundImage="linear-gradient("+o+","+o+"),url(\""+st.bgImg+"\")";c.style.backgroundSize="cover";c.style.backgroundPosition="center";c.style.backgroundRepeat="no-repeat"}else{c.style.backgroundImage="";c.style.backgroundSize="";c.style.backgroundPosition="";c.style.backgroundRepeat=""}}
function renderLayout(){document.querySelectorAll("[data-g]").forEach(function(x){x.classList.toggle("on",st[x.dataset.g]===x.dataset.v)})}
$("bgBtn").addEventListener("click",function(){$("bgfile").click()});
$("bgfile").addEventListener("change",function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){st.bgImg=r.result;$("bgname").textContent=f.name;renderBgs();applyBg();};r.readAsDataURL(f);});
$("bgDel").addEventListener("click",function(){st.bgImg="";$("bgfile").value="";$("bgname").textContent="";renderBgs();applyBg();});

$("save").addEventListener("click",async function(){
 var m=$("msg");m.textContent="กำลังสร้างรูป...";
 try{
  var cv=await html2canvas($("card"),{scale:2,useCORS:true,backgroundColor:null});
  var blob=await new Promise(function(r){cv.toBlob(r,"image/png")});
  var dl=null;try{dl=await claude.use("downloads")}catch(e){}
  if(dl){await dl.save({filename:"quote-card.png",data:blob});m.textContent="บันทึกแล้ว";}
  else{var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="quote-card.png";a.click();m.textContent="ส่งคำสั่งดาวน์โหลดแล้ว";}
 }catch(err){m.textContent=(err&&err.code==="declined")?"ยกเลิกการบันทึก":"บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง";}
});

$("impBtn").addEventListener("click",function(){
 try{var a=JSON.parse($("imp").value),n=0;
  a.forEach(function(x){if(x&&x.c&&x.t){(DB[x.c]=DB[x.c]||[]).push({t:String(x.t),s:String(x.s||"")});n++}});
  renderCats();renderPick();$("msg").textContent="นำเข้า "+n+" คำ";}
 catch(e){$("msg").textContent="รูปแบบ JSON ไม่ถูกต้อง";}
});

 lastQ=null;$("custom").value="";$("bgfile").value="";$("bgname").textContent="";$("ov").value=30;$("ovv").textContent="30%";renderLayout();applyBg();$("card").style.color="";$("card").style.flexDirection="";$("tcolor").value="#ffffff";$("font").selectedIndex=0;$("autoSz").checked=true;$("sz").disabled=true;$("sz").value=28;$("szv").textContent="28px";
 $("useSrc").checked=false;$("src").value="";$("fname").textContent="";$("file").value="";$("imp").value="";$("msg").textContent="";$("save").disabled=true;
 $("card").className="b0";$("card").innerHTML='<div class="ph">การ์ดจะแสดงที่นี่<br>กด “ประมวลผล”</div>';}
init();
